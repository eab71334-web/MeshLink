name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unpack:
    name: Unpack project
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack MeshLink.zip
        run: |
          if [ ! -f MeshLink.zip ]; then echo "No zip, skipping"; exit 0; fi
          unzip -q -o MeshLink.zip -d /tmp/ml
          rm -rf /tmp/ml/MeshLink/.github
          cp -a /tmp/ml/MeshLink/. .
          rm MeshLink.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack MeshLink project files" || true
          git push

  android:
    name: Android APK
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeshLink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS IPA (unsigned)
    needs: unpack
    runs-on: macos-latest
    env:
      SCHEME: MeshLink
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (no code signing)
        run: |
          xcodebuild -project ios/MeshLink.xcodeproj -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/$SCHEME.app" Payload/
          zip -qr "$SCHEME-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MeshLink-unsigned-ipa
          path: "*.ipa"
